<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission">
<link rel="icon" type="image/png" href="icons/icon_512.png">
<link rel="apple-touch-icon" href="icons/icon_180.png">
<title>Mission · 大一上冲刺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#263449; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --dim2:#64748b;
  --acc:#38bdf8; --ok:#4ade80; --warn:#fb923c; --lab:#a78bfa;
  --shadow:0 4px 16px rgba(0,0,0,.35);
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",sans-serif;
  font-size:15px; line-height:1.5; overscroll-behavior:none;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ===== 顶栏 ===== */
header{
  position:sticky;top:0;z-index:50;background:rgba(15,23,42,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
}
.headRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--dim2);letter-spacing:0}
.dateChip{
  font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  padding:5px 11px;border-radius:20px;white-space:nowrap;
}
.dateChip b{color:var(--acc);font-weight:600}

/* ===== 全局进度 ===== */
.gbarWrap{margin-top:10px}
.gbar{height:6px;background:#233144;border-radius:6px;overflow:hidden}
.gbarFill{
  height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,#38bdf8,#4ade80);
  transition:width .55s cubic-bezier(.22,1,.36,1);
}
.gbarTxt{display:flex;justify-content:space-between;font-size:11px;color:var(--dim2);margin-top:5px}

/* ===== 视图 ===== */
.view{display:none;padding-top:14px}
.view.on{display:block}

/* ===== 今日三件 ===== */
.trioTitle{font-size:13px;color:var(--dim2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.trioTitle span:last-child{font-size:12px;color:var(--dim2)}

.taskCard{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 15px 14px;margin-bottom:11px;position:relative;overflow:hidden;
  transition:transform .18s ease, opacity .3s ease, border-color .3s ease;
}
.taskCard:active{transform:scale(.985)}
.taskCard.done{opacity:.42;border-color:#2c3e57}
.taskCard.done .tName{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.tTaskTop{display:flex;align-items:flex-start;gap:12px}

.cbox{
  flex:0 0 26px;width:26px;height:26px;border-radius:9px;margin-top:1px;
  border:2px solid #465a75;position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.cbox.on{background:var(--ok);border-color:var(--ok)}
.cbox.on::after{
  content:"";width:7px;height:12px;border:2.5px solid #0f172a;border-top:0;border-left:0;
  transform:rotate(45deg) translate(-1px,-1px);
}
.tTaskBody{flex:1;min-width:0}
.tName{font-size:16px;font-weight:600;line-height:1.4;word-break:break-word}
.tMeta{font-size:12px;color:var(--dim2);margin-top:5px;display:flex;flex-wrap:wrap;gap:8px}
.tMeta i{font-style:normal}
.tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;
  background:#0d2436;color:var(--acc);border:1px solid #1b4a6b;font-weight:500;
}
.tag.core{background:#3b1d1d;color:#fca5a5;border-color:#6b2b2b}
.tag.soft{background:#2a2415;color:#fbbf24;border-color:#4d3f1b}
.tag.lab{background:#2a2244;color:#c4b5fd;border-color:#4c3f7a}
.tStart{
  font-size:12px;color:var(--dim);margin-top:9px;padding-top:9px;border-top:1px dashed #334155;
  display:flex;gap:6px;align-items:flex-start;
}
.tStart b{color:var(--warn);font-weight:600;flex:0 0 auto}

/* 完成环 */
.ring{
  position:absolute;inset:0;pointer-events:none;opacity:0;
}
.ring circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;
  stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.sweep{animation:ringSweep .65s cubic-bezier(.4,0,.2,1) forwards}
@keyframes ringSweep{
  0%{opacity:1}
  60%{opacity:.85}
  100%{opacity:0;stroke-dashoffset:0}
}

/* 全部完成 */
.allDone{
  text-align:center;padding:34px 18px;background:linear-gradient(160deg,#16301f,#1a2436);
  border:1px solid #2b5540;border-radius:18px;margin-bottom:14px;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.allDone .big{font-size:38px;margin-bottom:8px}
.allDone h3{font-size:18px;margin-bottom:6px;color:#86efac}
.allDone p{font-size:13px;color:var(--dim)}

/* 更多任务 */
.moreToggle{
  width:100%;background:transparent;border:1px dashed #334155;color:var(--dim2);
  padding:11px;border-radius:12px;font-size:13px;cursor:pointer;margin-top:2px;
  font-family:inherit;
}
.moreToggle:active{background:#1a2537}
.moreList{display:none;margin-top:11px}
.moreList.on{display:block}

/* ===== 周表 ===== */
.weekBar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.weekBar::-webkit-scrollbar{display:none}
.wd{
  flex:1 0 auto;min-width:44px;text-align:center;padding:8px 4px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--dim);cursor:pointer;
  transition:all .15s;
}
.wd small{display:block;font-size:10px;color:var(--dim2);margin-top:2px}
.wd.sel{background:#0d3b52;border-color:var(--acc);color:#bae6fd}
.wd.today small{color:var(--ok)}

.dayBlock{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden}
.dayBlock .dh{
  padding:10px 14px;font-size:13px;font-weight:600;background:var(--card2);
  display:flex;justify-content:space-between;align-items:center;
}
.dayBlock .dh em{font-style:normal;font-size:11px;color:var(--dim2);font-weight:400}
.slotRow{display:flex;gap:11px;padding:11px 14px;border-top:1px solid #243349;align-items:flex-start}
.slotTime{
  flex:0 0 74px;font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;
  letter-spacing:-.2px;padding-top:2px;
}
.slotMain{flex:1;min-width:0}
.slotName{font-size:14px;font-weight:500;line-height:1.35}
.slotName.core{color:#fca5a5}
.slotName.soft{color:#fcd34d}
.slotName.lab{color:#c4b5fd}
.slotName.free{color:var(--dim2);font-weight:400}
.slotNote{font-size:11.5px;color:var(--dim2);margin-top:3px;line-height:1.45}
.bar{height:3px;border-radius:3px;margin-top:7px;background:#334155;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:3px}
.bar.core>i{background:#f87171}
.bar.soft>i{background:#fbbf24}
.bar.lab>i{background:#a78bfa}
.bar.free>i{background:#475569}

/* ===== 设置/编辑 ===== */
.editor{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
.editor label{display:block;font-size:12px;color:var(--dim2);margin:9px 0 5px}
.editor input,.editor select,.editor textarea{
  width:100%;background:#0f1a2a;border:1px solid var(--line);border-radius:9px;
  color:var(--txt);padding:9px 11px;font-size:14px;font-family:inherit;outline:none;
}
.editor input:focus,.editor textarea:focus{border-color:var(--acc)}
.editor textarea{resize:vertical;min-height:52px}
.row2{display:flex;gap:9px}
.row2>div{flex:1}
.btn{
  background:var(--acc);color:#04141f;border:0;border-radius:10px;padding:10px 16px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn:active{opacity:.82}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn.danger{background:#7f1d1d;color:#fecaca}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btnRow{display:flex;gap:9px;margin-top:13px}
.secTitle{font-size:13px;color:var(--dim2);margin:18px 0 9px;display:flex;justify-content:space-between;align-items:center}
.secTitle b{font-size:13px;color:var(--txt)}
.editItem{
  display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;margin-bottom:8px;
}
.editItem .ei{flex:1;min-width:0}
.editItem .ei b{display:block;font-size:13.5px;font-weight:600}
.editItem .ei small{font-size:11px;color:var(--dim2)}
.iconBtn{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--dim);width:30px;height:30px;cursor:pointer;font-size:14px;line-height:1}
.empty{text-align:center;color:var(--dim2);font-size:13px;padding:26px 0}

/* ===== 底部导航 ===== */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:rgba(15,23,42,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:transparent;border:0;color:var(--dim2);padding:9px 0 10px;
  font-size:11px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:color .15s;
}
nav button .ni{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
nav button .badge{
  position:absolute;transform:translate(13px,-4px);background:var(--warn);color:#1a1206;
  font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:8px;
}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);
  background:#1e3a52;border:1px solid #2d5875;color:#bae6fd;
  padding:10px 18px;border-radius:12px;font-size:13px;z-index:100;opacity:0;
  transition:all .3s cubic-bezier(.22,1,.36,1);pointer-events:none;white-space:nowrap;
  box-shadow:var(--shadow);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 今天3件的选择器 */
.pickHint{font-size:12px;color:var(--dim2);margin-bottom:9px;line-height:1.55}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="headRow">
      <div class="brand">Mission
        <small id="sub">大一上 · 海大海洋科学</small>
      </div>
      <div class="dateChip" id="dateChip">— —</div>
    </div>
    <div class="gbarWrap">
      <div class="gbar"><div class="gbarFill" id="gFill"></div></div>
      <div class="gbarTxt"><span id="gLeft">今天还没开始</span><span id="gRight"></span></div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ========== 今日 ========== -->
  <section class="view on" id="v-today">
    <div class="trioTitle"><span>今天只做这几件</span><span id="trioCount"></span></div>
    <div id="trioList"></div>
    <button class="moreToggle" id="moreBtn">▾ 还有 <em id="moreNum">0</em> 件（做不完不算欠账）</button>
    <div class="moreList" id="moreList"></div>

    <div class="secTitle" style="margin-top:24px">
      <b>还想要点什么？</b>
      <button class="btn ghost sm" id="toPick">自己挑</button>
    </div>
    <div class="pickHint" id="pickHintBox">今天的 3 件是按周计划自动挑的。如果你想换，点「自己挑」。</div>
  </section>

  <!-- ========== 周表 ========== -->
  <section class="view" id="v-week">
    <div class="weekBar" id="weekBar"></div>
    <div id="weekBody"></div>
  </section>

  <!-- ========== 编辑 ========== -->
  <section class="view" id="v-edit">
    <div class="secTitle"><b>今日 3 件（手动挑选）</b>
      <button class="btn ghost sm" id="autoPick">恢复自动</button>
    </div>
    <div class="pickHint">勾选你想今天做的，最多 3 件。挑完就只看这 3 件。</div>
    <div id="pickList"></div>

    <div class="secTitle" style="margin-top:26px"><b>添加自定义任务</b></div>
    <div class="editor">
      <label>任务名</label>
      <input id="fName" placeholder="例如：做完第 3 章课后题 1-10">
      <div class="row2">
        <div><label>星期</label>
          <select id="fDay">
            <option value="1">周一</option><option value="2">周二</option>
            <option value="3">周三</option><option value="4">周四</option>
            <option value="5">周五</option><option value="6">周六</option>
            <option value="0">周日</option><option value="-1">每天都显示</option>
          </select></div>
        <div><label>优先级</label>
          <select id="fCore">
            <option value="1">核心（重要）</option>
            <option value="0">普通</option>
            <option value="2">弹性（可跳过）</option>
          </select></div>
      </div>
      <label>最小启动动作（拖延时只做这个）</label>
      <input id="fStart" placeholder="例如：只做第 1 题">
      <div class="btnRow">
        <button class="btn" id="addTask">添加</button>
      </div>
    </div>

    <div class="secTitle" style="margin-top:26px"><b>我添加的任务</b></div>
    <div id="customList"></div>

    <div class="secTitle" style="margin-top:26px"><b>数据</b></div>
    <div class="editor">
      <div class="pickHint">记录存在这台设备的浏览器里。换设备请用下面的备份码同步。</div>
      <div class="btnRow" style="margin-top:4px">
        <button class="btn ghost sm" id="btnExport">导出备份码</button>
        <button class="btn ghost sm" id="btnImport">导入备份码</button>
      </div>
      <div class="btnRow">
        <button class="btn danger sm" id="btnReset">清空本周记录</button>
      </div>
    </div>
  </section>

</main>

<nav>
  <button class="on" data-v="today"><span class="ni">✓</span>今日</button>
  <button data-v="week"><span class="ni">🗓</span>周表</button>
  <button data-v="edit"><span class="ni">✎</span>编辑</button>
</nav>

<div id="toast"></div>

/* =========================================================================
   状态管理
   ========================================================================= */
const KEY = 'dxy_plan_v1';
const today = new Date();
const dayIdx = today.getDay();               // 0=周日
const weekKey = isoWeek(today);

function isoWeek(d){
  const t = new Date(d.getTime());
  t.setHours(0,0,0,0); t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(),0,4);
  return t.getFullYear()+'-W'+String(1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)).padStart(2,'0');
}

let S = load();
function load(){
  try{ const o = JSON.parse(localStorage.getItem(KEY)||'{}');
       return {done:o.done||{}, custom:o.custom||[], picks:o.picks||[], picksDate:o.picksDate||'',
               streak:o.streak||0, lastAll:o.lastAll||'', wk:o.wk||''};
  }catch(e){ return {done:{},custom:[],picks:[],picksDate:'',streak:0,lastAll:'',wk:''}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// 每周自动清空 done（except 自定义）
if(S.wk !== weekKey){
  const nd = {};
  Object.keys(S.done).forEach(k=>{ if(k.startsWith('c_')) nd[k]=S.done[k]; });
  S.done = nd; S.wk = weekKey; save();
}

const todayStr = d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dkey = id => weekKey + '|' + id;
const isDone = id => !!S.done[dkey(id)];
function setDone(id,v){ if(v) S.done[dkey(id)]=1; else delete S.done[dkey(id)]; save(); }

/* 所有任务 = 内置 + 自定义 */
function allTasks(){
  const c = S.custom.map(x=>({...x, _custom:true}));
  return PLAN.concat(c);
}
function tasksForDay(d){
  return allTasks().filter(t=> t.day === d || t.day === -1)
                  .sort((a,b)=> (a.time||'').localeCompare(b.time||''));
}

/* 今天的 3 件：优先核心 → 再看是否手动挑选 */
function todaysPicks(){
  // 手动挑选
  if(S.picksDate === todayStr(today) && S.picks.length){
    const all = allTasks();
    return S.picks.map(id=>all.find(t=>t.id===id)).filter(Boolean);
  }
  const list = tasksForDay(dayIdx);
  // 核心优先（core===1），然后非弹性
  const core = list.filter(t=>t.core===1);
  if(core.length >= 3) return core.slice(0,3);
  const rest = list.filter(t=>t.core!==1 && t.core!==2);
  return core.concat(rest).slice(0,3);
}

/* =========================================================================
   渲染：今日
   ========================================================================= */
const DOW = ['周日','周一','周二','周三','周四','周五','周六'];

function fmtDate(d){
  return (d.getMonth()+1)+' 月 '+d.getDate()+' 日 · '+DOW[d.getDay()];
}

function catClass(t){
  if(t.cat==='core') return 'core';
  if(t.cat==='lab') return 'lab';
  if(t.core===2) return 'soft';
  if(t.cat==='class') return 'class';
  return '';
}
function coreTag(t){
  if(t.core===1) return '<span class="tag core">核心</span>';
  if(t.core===2) return '<span class="tag soft">弹性</span>';
  if(t.cat==='lab') return '<span class="tag lab">实验室</span>';
  if(t.cat==='class') return '<span class="tag">上课</span>';
  return '';
}

function taskCardHTML(t){
  const done = isDone(t.id);
  const cat = catClass(t);
  const nm = t.cat==='class' ? 'slotName' : '';
  return `<div class="taskCard ${done?'done':''}" data-id="${t.id}">
    <svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect x="1.5" y="1.5" width="97" height="97" rx="14" pathLength="1"
        style="fill:none;stroke:#4ade80;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round"/>
    </svg>
    <div class="tTaskTop">
      <div class="cbox ${done?'on':''}" data-check="${t.id}"></div>
      <div class="tTaskBody">
        <div class="tName ${nm}">${esc(t.name)}</div>
        <div class="tMeta">
          <i>${esc(t.time||'')}</i>
          ${coreTag(t)}
        </div>
        ${t.note?`<div class="tMeta" style="margin-top:4px"><i style="font-size:11.5px;color:#7d8ea5">${esc(t.note)}</i></div>`:''}
        ${t.start?`<div class="tStart"><b>最小启动 ›</b><span>${esc(t.start)}</span></div>`:''}
      </div>
    </div>
  </div>`;
}

function renderToday(){
  const picks = todaysPicks();
  const all = tasksForDay(dayIdx);
  const rest = all.filter(t=> !picks.some(p=>p.id===t.id));

  document.getElementById('dateChip').innerHTML = fmtDate(today).replace(' · ', ' <b>·</b> ');

  // 三件
  const donePicks = picks.filter(t=>isDone(t.id)).length;
  document.getElementById('trioCount').textContent = picks.length ? donePicks+' / '+picks.length : '';

  let html = '';
  if(picks.length && donePicks === picks.length){
    html += `<div class="allDone">
      <div class="big">✓</div>
      <h3>今天的 3 件做完了</h3>
      <p>剩下的时间都是你自己的。</p>
    </div>`;
  }
  html += picks.map(taskCardHTML).join('');
  document.getElementById('trioList').innerHTML = html;

  // 其余
  document.getElementById('moreNum').textContent = rest.length;
  document.getElementById('moreList').innerHTML = rest.map(taskCardHTML).join('');
  document.getElementById('moreBtn').style.display = rest.length? '' : 'none';

  // 进度条
  const totalCore = picks.length || 1;
  const pct = Math.round(donePicks/totalCore*100);
  document.getElementById('gFill').style.width = pct+'%';
  const left = totalCore - donePicks;
  document.getElementById('gLeft').textContent =
    donePicks===0 ? '今天还没开始' : (left===0 ? '今天的 3 件做完了 ✓' : '还剩 '+left+' 件');
  document.getElementById('gRight').textContent = donePicks+' / '+totalCore;

  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggle(el.dataset.check, el); };
  });

  document.getElementById('pickHintBox').textContent =
    (S.picksDate===todayStr(today) && S.picks.length)
      ? '现在显示的是你自己挑的 3 件。'
      : '今天的 3 件是按周计划自动挑的。如果你想换，点「自己挑」。';
}

function toggle(id, boxEl){
  const now = !isDone(id);
  setDone(id, now);
  const card = boxEl.closest('.taskCard');
  if(now && card){
    const ring = card.querySelector('.ring rect');
    if(ring){
      ring.style.animation='none'; void ring.offsetWidth;
      ring.style.animation='ringSweep .65s cubic-bezier(.4,0,.2,1) forwards';
      ring.style.strokeDashoffset='1';
    }
    const n = todaysPicks().filter(t=>isDone(t.id)).length;
    const tot = todaysPicks().length;
    toast(n===tot ? '今天的 3 件全做完了 ✓' : '完成 '+n+'/'+tot);
    if(n===tot) allDoneCelebrate();
  }
  renderToday();
  if(state === 'week') renderWeek(selDay);
  if(state === 'edit') renderPicks();
}

function allDoneCelebrate(){
  S.lastAll = todayStr(today);
  save();
}

/* =========================================================================
   渲染：周表
   ========================================================================= */
let selDay = dayIdx;

function renderWeek(){
  const days = [1,2,3,4,5,6,0];
  document.getElementById('weekBar').innerHTML = days.map(d=>{
    const t = tasksForDay(d);
    const n = t.filter(x=>x.core===1).length;
    const doneN = t.filter(x=>isDone(x.id)).length;
    return `<div class="wd ${d===selDay?'sel':''} ${d===dayIdx?'today':''}" data-day="${d}">
      ${DOW[d]}${n?` <b style="color:#fca5a5">·${n}</b>`:''}<small>${doneN}/${t.length}</small></div>`;
  }).join('');
  document.querySelectorAll('.wd').forEach(el=>{
    el.onclick = ()=>{ selDay = +el.dataset.day; renderWeek(); };
  });

  const list = tasksForDay(selDay);
  const maxDur = Math.max(...list.map(t=>t.dur||30), 60);
  document.getElementById('weekBody').innerHTML =
    `<div class="dayBlock">
      <div class="dh"><span>${DOW[selDay]}${selDay===dayIdx?'（今天）':''}</span>
        <em>${list.length} 项 · 核心 ${list.filter(t=>t.core===1).length} 项</em></div>
      ${list.map(t=>{
        const c = t.cat==='lab'?'lab':(t.core===1?'core':(t.core===2?'free':'soft'));
        const w = Math.max(6, Math.round((t.dur||30)/maxDur*100));
        return `<div class="slotRow">
          <div class="slotTime">${esc(t.time||'')}</div>
          <div class="slotMain">
            <div class="slotName ${c}">${isDone(t.id)?'✓ ':''}${esc(t.name)}</div>
            ${t.note?`<div class="slotNote">${esc(t.note)}</div>`:''}
            <div class="bar ${c}"><i style="width:${w}%"></i></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:11.5px;color:#475569;padding:4px 4px 10px;line-height:1.6">
      色条长度 = 时长大致比例。<span style="color:#f87171">红</span> 核心 ·
      <span style="color:#fcd34d">黄</span> 弹性/轻任务 ·
      <span style="color:#c4b5fd">紫</span> 实验室固定占用
    </div>`;
}

/* =========================================================================
   渲染：编辑 / 挑选
   ========================================================================= */
function renderPicks(){
  const all = tasksForDay(dayIdx);
  const cur = todaysPicks().map(t=>t.id);
  document.getElementById('pickList').innerHTML = all.map(t=>{
    const on = cur.includes(t.id);
    return `<div class="editItem" data-pick="${t.id}" style="${on?'border-color:#38bdf8;background:#12283a':''}">
      <div class="cbox ${on?'on':''}" style="pointer-events:none"></div>
      <div class="ei"><b>${esc(t.name)}</b><small>${esc(t.time||'')} ${t.core===1?'· 核心':''}</small></div>
      <button class="iconBtn" data-move="${t.id}" style="display:none">＊</button>
    </div>`;
  }).join('');
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.pick;
      let p = (S.picksDate===todayStr(today)) ? S.picks.slice() : todaysPicks().map(t=>t.id);
      if(p.includes(id)) p = p.filter(x=>x!==id);
      else { if(p.length>=3){ toast('最多挑 3 件'); return; } p.push(id); }
      S.picks = p; S.picksDate = todayStr(today); save();
      renderPicks(); renderToday();
    };
  });

  // 自定义任务列表
  const cs = S.custom;
  document.getElementById('customList').innerHTML = cs.length ? cs.map(t=>`
    <div class="editItem">
      <div class="ei"><b>${esc(t.name)}</b><small>${t.day===-1?'每天':DOW[t.day]} · ${t.core===1?'核心':t.core===2?'弹性':'普通'}</small></div>
      <button class="iconBtn" data-del="${t.id}">✕</button>
    </div>`).join('') : '<div class="empty">还没有自定义任务</div>';
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{
      S.custom = S.custom.filter(x=>x.id!==el.dataset.del); save();
      renderPicks(); renderToday();
    };
  });
}

/* =========================================================================
   toast
   ========================================================================= */
let toastT;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('on'), 1700);
}

/* =========================================================================
   导航
   ========================================================================= */
let state = 'today';
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = ()=>{
    state = b.dataset.v;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+state));
    if(state==='week') renderWeek();
    if(state==='edit') renderPicks();
    window.scrollTo({top:0,behavior:'instant'});
  };
});

document.getElementById('moreBtn').onclick = ()=>{
  const l = document.getElementById('moreList');
  const on = l.classList.toggle('on');
  document.getElementById('moreBtn').innerHTML =
    on ? '▴ 收起' : `▾ 还有 <em id="moreNum">${document.getElementById('moreNum').textContent}</em> 件（做不完不算欠账）`;
};
document.getElementById('toPick').onclick = ()=>{
  document.querySelector('nav button[data-v="edit"]').click();
};
document.getElementById('autoPick').onclick = ()=>{
  S.picks = []; S.picksDate=''; save();
  renderPicks(); renderToday(); toast('已恢复自动挑选');
};

/* 添加任务 */
document.getElementById('addTask').onclick = ()=>{
  const name = document.getElementById('fName').value.trim();
  if(!name){ toast('先写个任务名'); return; }
  S.custom.push({
    id: 'c_' + Date.now(),
    day: +document.getElementById('fDay').value,
    time: '',
    dur: 30,
    core: +document.getElementById('fCore').value,
    cat: 'soft',
    name,
    note: '',
    start: document.getElementById('fStart').value.trim(),
    barW: 1,
  });
  save();
  document.getElementById('fName').value='';
  document.getElementById('fStart').value='';
  renderPicks(); renderToday(); toast('加好了');
};

/* 数据 */
document.getElementById('btnReset').onclick = ()=>{
  if(confirm('清空本周所有打勾记录？（自定义任务保留）')){
    S.done = {}; save(); renderToday(); renderPicks(); toast('已清空');
  }
};
document.getElementById('btnExport').onclick = ()=>{
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  prompt('备份码（复制保存，换设备用导入）：', code);
};
document.getElementById('btnImport').onclick = ()=>{
  const code = prompt('粘贴备份码：');
  if(!code) return;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    S = Object.assign({done:{},custom:[],picks:[],picksDate:'',streak:0,lastAll:'',wk:''}, o);
    save(); renderToday(); renderWeek(); renderPicks(); toast('导入成功');
  }catch(e){ toast('备份码不对'); }
};

/* =========================================================================
   工具
   ========================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================================
   启动
   ========================================================================= */
renderToday();
renderWeek();
renderPicks();

// 深夜提示
(function(){
  const h = new Date().getHours();
  if(h>=23 || h<6){
    setTimeout(()=>{
      const n = todaysPicks().filter(t=>isDone(t.id)).length;
      if(n===0) toast('还没开始？只做最小启动动作就行');
    }, 1200);
  }
})();
